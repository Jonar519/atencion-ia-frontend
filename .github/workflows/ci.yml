name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, tests, mutaciones y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Rompe a propósito cada regla crítica (XSS, token fuera de memoria,
      # consentimiento, micrófono que no se apaga, WebRTC…) y exige que algún test falle.
      - run: npm run test:mutations
      - run: npm run build

  # Seguridad: npm audit de las dependencias de PRODUCCIÓN (lo que llega al
  # navegador) y gitleaks sobre todo el historial.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: npm audit (dependencias de producción)
        run: npm audit --omit=dev --audit-level=moderate
      - name: gitleaks (secretos en el historial)
        run: docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.21.2 git /repo --redact --verbose

  # E2E del flujo crítico (Playwright) contra el stack REAL con IA y voz
  # simuladas: Postgres + Redis de servicio, API y worker compilados desde
  # atencion-ia-backend, migraciones y seed de atencion-ia-database, y el build
  # de este repo servido con vite preview (con su CSP). Ver e2e/README.md.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atencion_ia_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atencion_ia_e2e
      REDIS_URL: redis://localhost:6379
      PGPASSWORD: postgres
      # Secretos SOLO para esta prueba efímera.
      JWT_SECRET: secreto-solo-para-e2e-en-ci-0123456789abcdef
      IP_HASH_SECRET: otro-secreto-solo-para-e2e-en-ci-9876543210
      AI_PROVIDER: mock
      VOICE_PROVIDER: mock
      LOG_LEVEL: warn
      CORS_ORIGIN: http://localhost:4175
    steps:
      - uses: actions/checkout@v5
      # Repos hermanos (públicos; si fueran privados: secret SIBLING_REPOS_TOKEN).
      - name: Checkout de atencion-ia-backend
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/atencion-ia-backend
          ref: ${{ vars.BACKEND_REPO_REF || 'main' }}
          token: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}
          path: _backend
      - name: Checkout de atencion-ia-database
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/atencion-ia-database
          ref: ${{ vars.DATABASE_REPO_REF || 'main' }}
          token: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}
          path: _database
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Migraciones y seed
        run: |
          bash _database/scripts/migrate.sh
          bash _database/scripts/seed.sh
      - name: API y worker (IA y voz simuladas)
        working-directory: _backend
        run: |
          npm ci
          npx prisma generate
          npm run build
          npm run kb:reindex
          PORT=4101 nohup node dist/server.js > ../api.log 2>&1 &
          WORKER_METRICS_PORT=9466 nohup node dist/workers/worker.js > ../worker.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4101/ready && exit 0; sleep 1; done
          cat ../api.log; exit 1
      - name: Build del frontend y vite preview (proxy a esa API)
        env:
          VITE_BACKEND_URL: http://localhost:4101
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 4175 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4175 > /dev/null && exit 0; sleep 1; done
          cat preview.log; exit 1
      - run: npx playwright install --with-deps chromium
      - name: Playwright (flujo crítico de texto y de voz)
        env:
          CI: "true"
        run: npm run test:e2e
      - name: Reporte, trazas y logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: |
            playwright-report
            test-results
            api.log
            worker.log
            preview.log
          if-no-files-found: ignore
